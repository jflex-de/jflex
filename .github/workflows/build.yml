name: Build

on:
  push:
    branches:
      - master
  pull_request:

env:
  PUBLISH_SOURCES: 'true'

# Separate cache for each job, because they need separate artefacts, which is
# also why the maven cache of setup-java does not work properly.

jobs:
  build:
    name: 'Maven & Examples'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        java: [ 8, 25 ]
      fail-fast: false
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.java }}
        distribution: zulu
        cache-jdk: true
    - name: Cache dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.m2/repository
          ~/.m2/wrapper
          ~/.ant
        key: deps-${{ github.job }}-${{ runner.os }}-jdk${{ matrix.java }}-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties', 'jflex/examples/common/*.xml') }}
        restore-keys: deps-${{ github.job }}-${{ runner.os }}-jdk${{ matrix.java }}-
    - name: '🔨 Maven (build, test)'
      run: scripts/test-unit.sh
    - name: '🔨 Maven (site)'
      run: scripts/mvn-site.sh
    - name: '🔨 Maven (aggregate sources)'
      run: scripts/mvn-aggregate-srcs.sh
    - name: '😎 Examples (mvn, ant, make)'
      run: scripts/test-examples.sh

  regression:
    name: 'Regression'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        java: [ 8, 25 ]
      fail-fast: false
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.java }}
        distribution: zulu
        cache-jdk: true
    - name: Cache dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.m2/repository
          ~/.m2/wrapper
        key: deps-${{ github.job }}-${{ runner.os }}-jdk${{ matrix.java }}-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
        restore-keys: deps-${{ github.job }}-${{ runner.os }}-jdk${{ matrix.java }}-
    - name: '📝 Regression tests'
      run: |
        scripts/mvn-install-fastbuild.sh jflex-maven-plugin
        scripts/test-regression.sh

  unicode:
    name: 'Unicode'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        java: [ 8, 25 ]
      fail-fast: false
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.java }}
        distribution: zulu
        cache-jdk: true
    - name: Cache dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.m2/repository
          ~/.m2/wrapper
        key: deps-${{ github.job }}-${{ runner.os }}-jdk${{ matrix.java }}-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
        restore-keys: deps-${{ github.job }}-${{ runner.os }}-jdk${{ matrix.java }}-
    - name: '📝 Unicode tests'
      run: |
        scripts/mvn-install-fastbuild.sh jflex-maven-plugin
        scripts/test-unicode.sh

  aggregated-sources:
    name: 'Aggregated sources'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        java-version: 25
        distribution: zulu
        cache-jdk: true
    # lib contains downloaded jars from compile.sh.
    - name: Cache dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.m2/repository
          ~/.m2/wrapper
          target/aggregated-java-sources/lib
        key: deps-${{ github.job }}-${{ runner.os }}-jdk25-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties', 'scripts/compile-aggregated-java-sources.sh') }}
        restore-keys: deps-${{ github.job }}-${{ runner.os }}-jdk25-
    - name: '🔨 Build JFlex'
      run: scripts/mvn-install-fastbuild.sh
    - name: '🔨 Check that aggregated sources compile'
      run: |
        mkdir -p target/aggregated-java-sources; cd target/aggregated-java-sources
        ../../scripts/copy-aggregated-java-sources.sh java
        cp ../../scripts/compile-aggregated-java-sources.sh compile.sh
        ./compile.sh
        ls java/jflex/Main.class

  javadoc:
    name: Javadoc
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 8, 25 ]
      fail-fast: false
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.java }}
        distribution: zulu
        cache-jdk: true
    - name: Cache dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.m2/repository
          ~/.m2/wrapper
        key: deps-${{ github.job }}-${{ runner.os }}-jdk${{ matrix.java }}-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
        restore-keys: deps-${{ github.job }}-${{ runner.os }}-jdk${{ matrix.java }}-
    - name: '🔨 Build JFlex jar'
      run: |
        ./mvnw -Pfastbuild install
    - name: '📝 Javadoc'
      run: |
        ./mvnw javadoc:javadoc
