name: Build

on:
  push:
    branches:
      - master
  pull_request:

env:
  PUBLISH_SOURCES: 'true'

jobs:
  build:
    name: 'Maven & Examples'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        java: [ 8, 25 ]
      fail-fast: false
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.java }}
        distribution: zulu
        cache: maven
    - name: '🔨 Maven (build, test)'
      run: scripts/test-unit.sh
    - name: '🔨 Maven (site)'
      run: scripts/mvn-site.sh
    - name: '🔨 Maven (aggregate sources)'
      run: scripts/mvn-aggregate-srcs.sh
    - name: '😎 Examples (mvn, ant, make)'
      run: scripts/test-examples.sh

  regression:
    name: 'Regression'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        java: [ 8, 25 ]
      fail-fast: false
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.java }}
        distribution: zulu
        cache: maven
    - name: '📝 Regression tests'
      run: |
        scripts/mvn-install-fastbuild.sh jflex-maven-plugin,testsuite/jflex-testsuite-maven-plugin
        scripts/test-regression.sh

  javatests:
    name: 'Dev tools'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 8, 25 ]
      fail-fast: false
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.java }}
        distribution: zulu
        cache: maven
    - name: '📝 Dev tools tests'
      run: |
        scripts/mvn-install-fastbuild.sh jflex-maven-plugin
        ./mvnw -pl java,javatests install

  aggregated-sources:
    name: 'Aggregated sources'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        java-version: 25
        distribution: zulu
        cache: maven
    - name: '🔨 Build JFlex'
      run: scripts/mvn-install-fastbuild.sh
    - name: '🔨 Check that aggregated sources compile'
      run: |
        mkdir -p target/aggregated-java-sources; cd target/aggregated-java-sources
        ../../scripts/copy-aggregated-java-sources.sh java
        cp ../../scripts/compile-aggregated-java-sources.sh compile.sh
        ./compile.sh
        ls java/jflex/Main.class

  javadoc:
    name: Javadoc
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 8, 25 ]
      fail-fast: false
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.java }}
        distribution: zulu
        cache: maven
    - name: '🔨 Build JFlex jar'
      run: |
        ./mvnw -Pfastbuild install
    - name: '📝 Javadoc'
      run: |
        ./mvnw javadoc:javadoc

  docs:
    name: 'Docs'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: 'Install LaTeX and pandoc'
      run: |
        sudo apt-get install \
             pandoc texlive texlive-latex-extra lmodern
    - name: "📄 Documentation"
      run: cd docs; make
