name: Code Style

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  java:
    name: 'Java Format'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version: 25
        distribution: zulu
    - run: scripts/test-java-format.sh
