name: Deploy Sources

on:
  push:
    branches:
      - master

env:
  PUBLISH_SOURCES: 'true'

jobs:

  deploy:
    name: 'Sources'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        path: jflex
    - uses: actions/checkout@v3
      with:
        ref: aggregated-java-sources
        path: aggregated-java-sources
    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        # Fixed JDK version to keep [:jletter:] character class constant.
        java-version: 25
        distribution: zulu
        cache: maven
    - name: 'Prepare aggregated sources'
      run: |
        cd jflex; scripts/prepare-deploy-source-code.sh
    - name: 'Push'
      run: |
        cd aggregated-java-sources; git push
