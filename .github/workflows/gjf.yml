name: Code Style

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  java:
    name: 'Java Format'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-java@v3
      with:
        java-version: 21 # recent versions of Google Java Format require JDK 21+
        distribution: zulu
    - run: scripts/test-java-format.sh
