version = 1
SPDX-PackageName = "JFlex"
SPDX-PackageSupplier = "Gerwin Klein <lsf@jflex.de>"
SPDX-PackageDownloadLocation = "https://github.com/jflex-de/jflex/"

[[annotations]]
path = [
  "jflex/examples/**/**.good",
  "jflex/examples/**/src/test/data/test.txt",
  "jflex/examples/standalone/src/test/data/sample.expected",
  "jflex/examples/standalone/src/test/data/sample.in",
  "jflex/examples/zero-reader/src/test/data/test-input.txt",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2020, Gerwin Klein"
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = [
  "tests/regression/src/test/cases/**/**.input",
  "tests/regression/src/test/cases/**/**.output",
  "tests/regression/src/test/cases/**/**.test",
  "tests/regression/src/test/cases/**/**.flex",
  "tests/unicode/src/test/cases/**/**.input",
  "tests/unicode/src/test/cases/**/**.output",
  "tests/unicode/src/test/cases/**/**.test",
  "tests/unicode/src/test/cases/**/**.flex",
  "tests/unicode/src/test/uax/**/**.test",
  "tests/unicode/src/test/uax/**/**.flex",
  "tests/regression/src/test/java/de/jflex/testcase/**/**.input",
  "tests/regression/src/test/java/de/jflex/testcase/**/**.output",
  "tests/regression/src/test/java/de/jflex/testcase/**/**.out",
  "tests/regression/src/test/java/de/jflex/testcase/**/**.txt",
  "tests/regression/src/test/java/de/jflex/testcase/caseless_jlex/caseless.sysout",
  "tests/regression/src/test/java/de/jflex/testcase/dot_newline/dotnewline.sysout",
  "tests/regression/src/test/java/de/jflex/testcase/eol_look/eol.sysout",
  "tests/regression/src/test/java/de/jflex/testcase/genlook/genlook.sysout",
  "tests/regression/src/test/java/de/jflex/testcase/include/inp2",
  "tests/regression/src/test/java/de/jflex/testcase/include/inp3",
  "tests/regression/src/test/java/de/jflex/testcase/include/skeleton.nested",
  "tests/regression/src/test/java/de/jflex/testcase/include2/nested2",
  "tests/regression/src/test/java/de/jflex/testcase/include2/nested3",
  "tests/regression/src/test/java/de/jflex/testcase/include2/skeleton.nested",
  "tests/regression/src/test/java/de/jflex/testcase/line_cont/line-flex.sysout",
  "tests/regression/src/test/java/de/jflex/testcase/spoon_feed_reader/problematic.skeleton.default",
  "tests/unicode/src/test/java/de/jflex/testcase/**/**.input",
  "tests/unicode/src/test/java/de/jflex/testcase/**/**.output",
  "tests/unicode/src/test/java/de/jflex/testcase/**/**.out",
  "tests/unicode/src/test/java/de/jflex/testcase/**/**.txt",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2020, Gerwin Klein, Régis Décamps, Steve Rowe"
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
# Tables generated from the Unicode Character Database, which the tests/unicode build downloads.
path = [
  "jflex/src/main/java/jflex/core/unicode/UnicodeProperties.java",
  "jflex/src/main/java/jflex/core/unicode/data/Unicode_*.java",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "1991-2018, Unicode, Inc."
SPDX-License-Identifier = "Unicode-DFS-2016"

[[annotations]]
path = [
  "tests/generators/src/test/java/de/jflex/ucd_generator/FakeUnicodeData.txt",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2021, Google, LLC."
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = [
  "docs/fig/jflex-black.ai",
  "docs/fig/jflex-black.pdf",
  "docs/fig/jflex-black.png",
  "docs/fig/logo.png",
  "docs/fig/logo_clean.psd",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2020, Gerwin Klein"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = [
  "tests/regression/third_party/cup2/edu/tum/cup2/**/**.java",
  "tests/regression/third_party/cup2/license.txt",
  "tests/regression/third_party/cup2/edu/tum/cup2/spec/How_or_how_not_to_find_true_lr1_grammars",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (c) 2014 Andreas Wenger, Michael Petter"
SPDX-License-Identifier = "Zlib"

[[annotations]]
path = "jflex/src/main/resources/LICENSE_JFLEX"
precedence = "aggregate"
SPDX-FileCopyrightText = "2023, Gerwin Klein, Régis Décamps, Steve Rowe"
SPDX-License-Identifier = "CC0-1.0"
